name: Block secret files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked env and pem files
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -E '(^|/)\.env($|\.(local|prod|development\.local|test\.local|production\.local)$)|(^|/).+\.pem$' || true)
          if [ -n "$forbidden" ]; then
            echo "These tracked files are not allowed in a public repo:"
            echo "$forbidden"
            exit 1
          fi
          echo "No forbidden secret files are tracked."
